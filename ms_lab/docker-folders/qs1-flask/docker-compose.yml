version: "3.9"

services:

  app:
    build: .
    container_name: flask-app

    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: mydatabase

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase

    ports:
      - "5432:5432"