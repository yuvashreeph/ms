apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-monolith
  template:
    metadata:
      labels:
        app: shopping-monolith
    spec:
      containers:
        - name: shopping-monolith
          image: shopping-monolith:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-monolith-service
spec:
  selector:
    app: shopping-monolith
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
